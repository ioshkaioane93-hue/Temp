
<html>
<head>
    <title>იოს პირველი საიტი</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            transition: 0.3s;
        }

        .container {
            background-color: white;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            width: 350px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: 0.3s;
        }

        h1 {
            color: #764ba2;
            font-size: 25px;
        }

        input {
            width: 90%;
            padding: 12px;
            margin: 10px 0;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
        }

        input:focus {
            outline: none;
            border-color: #764ba2;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            font-size: 18px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            transform: scale(1.05);
            opacity: 0.9;
        }

        #result {
            margin-top: 20px;
            color: #764ba2;
            font-size: 18px;
            font-weight: bold;
            overflow-wrap: anywhere;
        }

        /* Dark mode button */
        #darkButton {
            position: fixed;
            top: 20px;
            right: 20px;
            width: auto;
            padding: 12px 18px;
            margin: 0;
            background: #222;
            color: white;
            border: 2px solid white;
            border-radius: 25px;
        }

        /* Dark mode styles */
        body.dark {
            background: linear-gradient(135deg, #141e30, #243b55);
        }

        body.dark .container {
            background-color: #222;
        }

        body.dark h1 {
            color: #bb86fc;
        }

        body.dark input {
            background-color: #333;
            color: white;
            border-color: #555;
        }

        body.dark input::placeholder {
            color: #bbb;
        }

        body.dark #result {
            color: #bb86fc;
        }
    </style>
</head>

<body>

    <button id="darkButton" onclick="toggleDarkMode()">
        🌙 Dark Mode
    </button>

    <div class="container">

        <h1>მოგესალმებით, ჩემს პირველ საიტზე</h1>

        <input type="text" id="userInput" placeholder="შეიყვანეთ ტექსტი">

        <input type="number" id="count" placeholder="რამდენჯერ დავბეჭდო?">

        <button onclick="repeatText()">ბეჭდვა</button>

        <div id="result"></div>

    </div>

    <script>
        function repeatText() {
            let value = document.getElementById("userInput").value;
            let count = Number(document.getElementById("count").value);

            let result = "";

            for (let i = 0; i < count; i++) {
                result += value + "<br>";
            }

            document.getElementById("result").innerHTML = result;
        }

        function toggleDarkMode() {
            document.body.classList.toggle("dark");

            let button = document.getElementById("darkButton");

            if (document.body.classList.contains("dark")) {
                button.innerHTML = "☀️ Light Mode";
            } else {
                button.innerHTML = "🌙 Dark Mode";
            }
        }
    </script>

</body>
</html>
