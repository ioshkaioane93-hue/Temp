
<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <title>იოს პირველი საიტი</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            transition: 0.3s;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            width: 350px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: 0.3s;
        }

        h1 {
            color: #764ba2;
            font-size: 25px;
        }

        input {
            box-sizing: border-box;
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
        }

        input:focus {
            outline: none;
            border-color: #764ba2;
        }

        input[type="color"] {
            height: 45px;
            cursor: pointer;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 12px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            font-size: 17px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            transform: scale(1.04);
            opacity: 0.9;
        }

        #result {
            margin-top: 20px;
            color: #764ba2;
            font-size: 18px;
            font-weight: bold;
            overflow-wrap: anywhere;
        }

        #darkButton {
            position: fixed;
            top: 20px;
            right: 20px;
            width: auto;
            padding: 12px 18px;
            margin: 0;
            background: #222;
            border: 2px solid white;
            border-radius: 25px;
        }

        body.dark {
            background: linear-gradient(135deg, #141e30, #243b55);
        }

        body.dark .container {
            background: #222;
        }

        body.dark h1 {
            color: #bb86fc;
        }

        body.dark input {
            background: #333;
            color: white;
            border-color: #555;
        }

        body.dark input::placeholder {
            color: #bbb;
        }

        body.dark #result {
            color: #bb86fc;
        }

        .label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        .clear {
            background: #e74c3c;
        }

        .clear:hover {
            background: #c0392b;
        }
    </style>
</head>

<body>

    <button id="darkButton" onclick="toggleDarkMode()">
        🌙 Dark Mode
    </button>

    <div class="container">

        <h1>მოგესალმებით, ჩემს პირველ საიტზე!</h1>

        <input
            type="text"
            id="userInput"
            placeholder="შეიყვანეთ ტექსტი"
        >

        <input
            type="number"
            id="count"
            placeholder="რამდენჯერ დავბეჭდო?"
            min="1"
            max="100"
        >

        <label class="label" for="textColor">
            🌈 აირჩიე ტექსტის ფერი:
        </label>

        <input
            type="color"
            id="textColor"
            value="#764ba2"
        >

        <button onclick="repeatText()">
            ბეჭდვა 🖨️
        </button>

        <button class="clear" onclick="clearText()">
            გასუფთავება 🧹
        </button>

        <div id="result"></div>

    </div>

    <script>

        function repeatText() {

            let value = document.getElementById("userInput").value;
            let count = Number(document.getElementById("count").value);

            let result = document.getElementById("result");

            if (value.trim() === "") {
                alert("გთხოვ, შეიყვანე ტექსტი!");
                return;
            }

            if (!Number.isInteger(count) || count < 1 || count > 100) {
                alert("შეიყვანე რიცხვი 1-დან 100-მდე!");
                return;
            }

            result.innerHTML = "";

            for (let i = 0; i < count; i++) {
                let line = document.createElement("div");
                line.textContent = value;
                result.appendChild(line);
            }

            changeTextColor();
        }

        function toggleDarkMode() {

            document.body.classList.toggle("dark");

            let button = document.getElementById("darkButton");

            if (document.body.classList.contains("dark")) {
                button.innerHTML = "☀️ Light Mode";
            } else {
                button.innerHTML = "🌙 Dark Mode";
            }
        }

        function clearText() {

            document.getElementById("result").innerHTML = "";
            document.getElementById("userInput").value = "";
            document.getElementById("count").value = "";

        }

        function changeTextColor() {

            let color = document.getElementById("textColor").value;

            document.getElementById("result").style.color = color;

        }

        document.getElementById("textColor").addEventListener(
            "input",
            changeTextColor
        );

    </script>

</body>
</html>
