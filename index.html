
<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>იოს პირველი საიტი</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #667eea, #764ba2);
    transition: 0.4s;
    padding: 90px 15px 30px;
}

.container {
    background: white;
    padding: 35px;
    border-radius: 22px;
    text-align: center;
    width: 100%;
    max-width: 390px;
    box-shadow: 0 15px 40px rgba(0,0,0,0.25);
    transition: 0.4s;
}

h1 {
    color: #764ba2;
    font-size: 25px;
}

.clock {
    position: fixed;
    top: 20px;
    left: 20px;
    background: rgba(255,255,255,0.2);
    color: white;
    padding: 12px 18px;
    border-radius: 15px;
    font-size: 17px;
    backdrop-filter: blur(10px);
}

input {
    width: 100%;
    padding: 12px;
    margin: 10px 0;
    border: 2px solid #ddd;
    border-radius: 10px;
    font-size: 16px;
}

input:focus {
    outline: none;
    border-color: #764ba2;
}

input[type="color"] {
    height: 45px;
    cursor: pointer;
}

input[type="range"] {
    cursor: pointer;
}

button {
    width: 100%;
    padding: 12px;
    margin-top: 10px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: white;
    font-size: 16px;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    transform: scale(1.04);
    opacity: 0.9;
}

#darkButton {
    position: fixed;
    top: 20px;
    right: 20px;
    width: auto;
    padding: 12px 18px;
    background: #222;
}

.label {
    display: block;
    margin-top: 15px;
    font-weight: bold;
    color: #764ba2;
}

#result {
    margin-top: 20px;
    font-size: 18px;
    font-weight: bold;
    overflow-wrap: anywhere;
}

.result-line {
    animation: appear 0.4s ease both;
    margin: 5px 0;
}

@keyframes appear {
    from {
        opacity: 0;
        transform: translateY(15px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.clear {
    background: #e74c3c;
}

.copy {
    background: #16a085;
}

body.dark {
    background: linear-gradient(135deg, #141e30, #243b55);
}

body.dark .container {
    background: #222;
}

body.dark h1,
body.dark .label {
    color: #bb86fc;
}

body.dark input {
    background: #333;
    color: white;
    border-color: #555;
}

body.dark input::placeholder {
    color: #bbb;
}

body.dark #result {
    color: #bb86fc;
}

body.dark .clock {
    background: rgba(0,0,0,0.3);
}

#message {
    margin-top: 12px;
    font-size: 14px;
    color: #16a085;
}
</style>
</head>

<body>

<div class="clock">
    <div id="time">00:00:00</div>
    <div id="date"></div>
</div>

<button id="darkButton" onclick="toggleDarkMode()">
    🌙 Dark Mode
</button>

<div class="container">

    <h1>მოგესალმებით ჩემს საიტზე! 🚀</h1>

    <p>შექმენი შენი საკუთარი ტექსტი!</p>

    <input
        type="text"
        id="userInput"
        placeholder="შეიყვანეთ ტექსტი"
    >

    <input
        type="number"
        id="count"
        placeholder="რამდენჯერ დავბეჭდო?"
        min="1"
        max="100"
    >

    <label class="label">🌈 ტექსტის ფერი</label>

    <input type="color" id="textColor" value="#764ba2">

    <label class="label">
        🔠 ტექსტის ზომა:
        <span id="sizeValue">18</span> px
    </label>

    <input
        type="range"
        id="textSize"
        min="12"
        max="40"
        value="18"
    >

    <button onclick="repeatText()">
        🖨️ ბეჭდვა
    </button>

    <button class="copy" onclick="copyText()">
        📋 ტექსტის კოპირება
    </button>

    <button class="clear" onclick="clearText()">
        🧹 გასუფთავება
    </button>

    <div id="result"></div>

    <div id="message"></div>

</div>

<script>

// ციფრული საათი

function updateClock() {
    let now = new Date();

    document.getElementById("time").textContent =
        now.toLocaleTimeString("ka-GE");

    document.getElementById("date").textContent =
        now.toLocaleDateString("ka-GE");
}

updateClock();
setInterval(updateClock, 1000);


// ტექსტის გამეორება

function repeatText() {

    let value = document.getElementById("userInput").value;
    let count = Number(document.getElementById("count").value);
    let result = document.getElementById("result");

    if (value.trim() === "") {
        alert("გთხოვ, შეიყვანე ტექსტი!");
        return;
    }

    if (!Number.isInteger(count) || count < 1 || count > 100) {
        alert("შეიყვანე რიცხვი 1-დან 100-მდე!");
        return;
    }

    result.innerHTML = "";

    for (let i = 0; i < count; i++) {

        let line = document.createElement("div");

        line.className = "result-line";
        line.textContent = value;

        result.appendChild(line);
    }

    changeTextColor();
    changeTextSize();

    document.getElementById("message").textContent =
        "წარმატებით დაიბეჭდა " + count + " ტექსტი! 🎉";
}


// Dark Mode

function toggleDarkMode() {

    document.body.classList.toggle("dark");

    let button = document.getElementById("darkButton");

    if (document.body.classList.contains("dark")) {
        button.textContent = "☀️ Light Mode";
    } else {
        button.textContent = "🌙 Dark Mode";
    }
}


// გასუფთავება

function clearText() {

    document.getElementById("result").innerHTML = "";
    document.getElementById("userInput").value = "";
    document.getElementById("count").value = "";
    document.getElementById("message").textContent = "";
}


// ფერის შეცვლა

function changeTextColor() {

    let color = document.getElementById("textColor").value;

    document.getElementById("result").style.color = color;
}

document.getElementById("textColor").addEventListener(
    "input", changeTextColor
);


// ტექსტის ზომის შეცვლა

function changeTextSize() {

    let size = document.getElementById("textSize").value;

    document.getElementById("result").style.fontSize = size + "px";

    document.getElementById("sizeValue").textContent = size;
}

document.getElementById("textSize").addEventListener(
    "input", changeTextSize
);


// ტექსტის კოპირება

function copyText() {

    let text = document.getElementById("result").innerText;

    if (text === "") {
        alert("ჯერ დაბეჭდე რაიმე ტექსტი!");
        return;
    }

    navigator.clipboard.writeText(text)
        .then(() => {
            document.getElementById("message").textContent =
                "ტექსტი დაკოპირდა! 📋";
        })
        .catch(() => {
            alert("კოპირება ვერ მოხერხდა.");
        });
}

</script>

</body>
</html>
