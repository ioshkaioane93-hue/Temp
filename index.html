
<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>იოს პირველი საიტი</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #667eea, #764ba2);
    transition: 0.4s;
    padding: 90px 15px 30px;
}

.container {
    background: white;
    padding: 35px;
    border-radius: 22px;
    text-align: center;
    width: 100%;
    max-width: 430px;
    box-shadow: 0 15px 40px rgba(0,0,0,0.25);
    transition: 0.4s;
}

h1 {
    color: #764ba2;
    font-size: 25px;
}

h2 {
    color: #764ba2;
    margin-top: 25px;
}

.clock {
    position: fixed;
    top: 20px;
    left: 20px;
    background: rgba(255,255,255,0.2);
    color: white;
    padding: 12px 18px;
    border-radius: 15px;
    font-size: 17px;
    backdrop-filter: blur(10px);
}

input, select {
    width: 100%;
    padding: 12px;
    margin: 10px 0;
    border: 2px solid #ddd;
    border-radius: 10px;
    font-size: 16px;
}

input:focus, select:focus {
    outline: none;
    border-color: #764ba2;
}

input[type="color"] {
    height: 45px;
    cursor: pointer;
}

input[type="range"] {
    cursor: pointer;
}

button {
    width: 100%;
    padding: 12px;
    margin-top: 10px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: white;
    font-size: 16px;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    transform: scale(1.03);
    opacity: 0.9;
}

#darkButton {
    position: fixed;
    top: 20px;
    right: 20px;
    width: auto;
    padding: 12px 18px;
    background: #222;
}

.label {
    display: block;
    margin-top: 15px;
    font-weight: bold;
    color: #764ba2;
}

#result {
    margin-top: 20px;
    font-size: 18px;
    font-weight: bold;
    overflow-wrap: anywhere;
}

.result-line {
    animation: appear 0.4s ease both;
    margin: 5px 0;
}

@keyframes appear {
    from {
        opacity: 0;
        transform: translateY(15px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.clear {
    background: #e74c3c;
}

.copy {
    background: #16a085;
}

body.dark {
    background: linear-gradient(135deg, #141e30, #243b55);
}

body.dark .container {
    background: #222;
}

body.dark h1,
body.dark h2,
body.dark .label {
    color: #bb86fc;
}

body.dark input,
body.dark select {
    background: #333;
    color: white;
    border-color: #555;
}

body.dark input::placeholder {
    color: #bbb;
}

body.dark #result {
    color: #bb86fc;
}

body.dark .clock {
    background: rgba(0,0,0,0.3);
}

#message {
    margin-top: 12px;
    font-size: 14px;
    color: #16a085;
}

/* ქვიზის დიზაინი */

.quiz-section {
    border-top: 2px solid #eee;
    margin-top: 35px;
    padding-top: 15px;
}

.question-card {
    background: #f3f0fa;
    color: #333;
    padding: 15px;
    border-radius: 12px;
    margin-top: 12px;
    text-align: left;
}

.question-card button {
    background: #e74c3c;
    padding: 8px;
    font-size: 14px;
}

.quiz-option {
    background: #667eea;
    text-align: left;
}

.quiz-option:disabled {
    opacity: 0.8;
    cursor: default;
}

.quiz-feedback {
    margin-top: 15px;
    font-weight: bold;
}

.quiz-small {
    font-size: 14px;
    color: #777;
}

body.dark .question-card {
    background: #333;
    color: white;
}

body.dark .quiz-small {
    color: #ccc;
}

body.dark .quiz-section {
    border-color: #555;
}

body.dark .quiz-question {
    color: #bb86fc;
}
</style>
</head>

<body>

<div class="clock">
    <div id="time">00:00:00</div>
    <div id="date"></div>
</div>

<button id="darkButton" onclick="toggleDarkMode()">
    🌙 Dark Mode
</button>

<div class="container">

    <h1>მოგესალმებით ჩემს საიტზე! 🚀</h1>

    <p>შექმენი შენი საკუთარი ტექსტი!</p>

    <input type="text" id="userInput" placeholder="შეიყვანეთ ტექსტი">

    <input type="number" id="count" placeholder="რამდენჯერ დავბეჭდო?" min="1" max="100">

    <label class="label">🌈 ტექსტის ფერი</label>
    <input type="color" id="textColor" value="#764ba2">

    <label class="label">
        🔠 ტექსტის ზომა:
        <span id="sizeValue">18</span> px
    </label>

    <input type="range" id="textSize" min="12" max="40" value="18">

    <button onclick="repeatText()">🖨️ ბეჭდვა</button>
    <button class="copy" onclick="copyText()">📋 ტექსტის კოპირება</button>
    <button class="clear" onclick="clearText()">🧹 გასუფთავება</button>

    <div id="result"></div>
    <div id="message"></div>


    <!-- ქვიზის შემქმნელი -->

    <div class="quiz-section">

        <h2>🧠 ჩემი ქვიზი</h2>
        <p>შექმენი საკუთარი კითხვები და ითამაშე!</p>

        <div id="creator">

            <label class="label">❓ შეიყვანე კითხვა</label>
            <input type="text" id="questionInput" placeholder="მაგ: რომელია საქართველოს დედაქალაქი?">

            <label class="label">A პასუხი</label>
            <input type="text" id="answerA" placeholder="პირველი პასუხი">

            <label class="label">B პასუხი</label>
            <input type="text" id="answerB" placeholder="მეორე პასუხი">

            <label class="label">C პასუხი</label>
            <input type="text" id="answerC" placeholder="მესამე პასუხი">

            <label class="label">D პასუხი</label>
            <input type="text" id="answerD" placeholder="მეოთხე პასუხი">

            <label class="label">✅ აირჩიე სწორი პასუხი</label>

            <select id="correctAnswer">
                <option value="0">A პასუხი</option>
                <option value="1">B პასუხი</option>
                <option value="2">C პასუხი</option>
                <option value="3">D პასუხი</option>
            </select>

            <button onclick="addQuestion()">➕ კითხვის დამატება</button>

            <p class="quiz-small" id="questionCount">
                დამატებულია 0 კითხვა
            </p>

            <div id="questionList"></div>

            <button onclick="startQuiz()">🎮 ქვიზის დაწყება</button>

        </div>

        <!-- თამაშის ნაწილი -->

        <div id="game" style="display:none;">

            <p id="progress" class="quiz-small"></p>

            <h3 id="gameQuestion" class="quiz-question"></h3>

            <div id="gameAnswers"></div>

            <div id="feedback" class="quiz-feedback"></div>

            <button id="nextButton" onclick="nextQuestion()" style="display:none;">
                შემდეგი კითხვა ➡️
            </button>

        </div>

        <!-- შედეგები -->

        <div id="quizResult" style="display:none;">

            <h2>🏆 ქვიზი დასრულდა!</h2>

            <h3 id="scoreText"></h3>

            <p id="resultMessage"></p>

            <button onclick="restartQuiz()">🔄 თავიდან თამაში</button>
            <button class="clear" onclick="backToCreator()">✏️ კითხვების შეცვლა</button>

        </div>

    </div>

</div>


<script>

// ციფრული საათი

function updateClock() {
    let now = new Date();

    document.getElementById("time").textContent =
        now.toLocaleTimeString("ka-GE");

    document.getElementById("date").textContent =
        now.toLocaleDateString("ka-GE");
}

updateClock();
setInterval(updateClock, 1000);


// ტექსტის გამეორება

function repeatText() {

    let value = document.getElementById("userInput").value;
    let count = Number(document.getElementById("count").value);
    let result = document.getElementById("result");

    if (value.trim() === "") {
        alert("გთხოვ, შეიყვანე ტექსტი!");
        return;
    }

    if (!Number.isInteger(count) || count < 1 || count > 100) {
        alert("შეიყვანე რიცხვი 1-დან 100-მდე!");
        return;
    }

    result.innerHTML = "";

    for (let i = 0; i < count; i++) {
        let line = document.createElement("div");
        line.className = "result-line";
        line.textContent = value;
        result.appendChild(line);
    }

    changeTextColor();
    changeTextSize();

    document.getElementById("message").textContent =
        "წარმატებით დაიბეჭდა " + count + " ტექსტი! 🎉";
}


// Dark Mode

function toggleDarkMode() {

    document.body.classList.toggle("dark");

    let button = document.getElementById("darkButton");

    if (document.body.classList.contains("dark")) {
        button.textContent = "☀️ Light Mode";
    } else {
        button.textContent = "🌙 Dark Mode";
    }
}


// გასუფთავება

function clearText() {

    document.getElementById("result").innerHTML = "";
    document.getElementById("userInput").value = "";
    document.getElementById("count").value = "";
    document.getElementById("message").textContent = "";
}


// ფერის შეცვლა

function changeTextColor() {
    let color = document.getElementById("textColor").value;
    document.getElementById("result").style.color = color;
}

document.getElementById("textColor").addEventListener(
    "input", changeTextColor
);


// ტექსტის ზომის შეცვლა

function changeTextSize() {

    let size = document.getElementById("textSize").value;

    document.getElementById("result").style.fontSize = size + "px";
    document.getElementById("sizeValue").textContent = size;
}

document.getElementById("textSize").addEventListener(
    "input", changeTextSize
);


// ტექსტის კოპირება

function copyText() {

    let text = document.getElementById("result").innerText;

    if (text === "") {
        alert("ჯერ დაბეჭდე რაიმე ტექსტი!");
        return;
    }

    navigator.clipboard.writeText(text)
        .then(() => {
            document.getElementById("message").textContent =
                "ტექსტი დაკოპირდა! 📋";
        })
        .catch(() => {
            alert("კოპირება ვერ მოხერხდა.");
        });
}


// =================================
// ქვიზის სისტემა
// =================================

let questions = [];
let currentQuestion = 0;
let score = 0;
let answered = false;


// კითხვის დამატება

function addQuestion() {

    let question = document.getElementById("questionInput").value.trim();

    let answers = [
        document.getElementById("answerA").value.trim(),
        document.getElementById("answerB").value.trim(),
        document.getElementById("answerC").value.trim(),
        document.getElementById("answerD").value.trim()
    ];

    let correct = Number(document.getElementById("correctAnswer").value);

    if (question === "") {
        alert("შეიყვანე კითხვა!");
        return;
    }

    if (answers.some(answer => answer === "")) {
        alert("შეავსე პასუხის ყველა ვარიანტი!");
        return;
    }

    questions.push({
        question: question,
        answers: answers,
        correct: correct
    });

    document.getElementById("questionInput").value = "";
    document.getElementById("answerA").value = "";
    document.getElementById("answerB").value = "";
    document.getElementById("answerC").value = "";
    document.getElementById("answerD").value = "";
    document.getElementById("correctAnswer").value = "0";

    updateQuestionList();
}


// კითხვების სიის განახლება

function updateQuestionList() {

    let list = document.getElementById("questionList");
    list.innerHTML = "";

    document.getElementById("questionCount").textContent =
        "დამატებულია " + questions.length + " კითხვა";

    questions.forEach((item, index) => {

        let card = document.createElement("div");
        card.className = "question-card";

        let title = document.createElement("strong");
        title.textContent = (index + 1) + ". " + item.question;

        let remove = document.createElement("button");
        remove.textContent = "🗑️ კითხვის წაშლა";
        remove.onclick = function() {
            questions.splice(index, 1);
            updateQuestionList();
        };

        card.appendChild(title);
        card.appendChild(remove);
        list.appendChild(card);
    });
}


// ქვიზის დაწყება

function startQuiz() {

    if (questions.length === 0) {
        alert("ჯერ დაამატე მინიმუმ ერთი კითხვა!");
        return;
    }

    currentQuestion = 0;
    score = 0;

    document.getElementById("creator").style.display = "none";
    document.getElementById("game").style.display = "block";
    document.getElementById("quizResult").style.display = "none";

    showQuestion();
}


// კითხვის ჩვენება

function showQuestion() {

    answered = false;

    let item = questions[currentQuestion];

    document.getElementById("progress").textContent =
        "კითხვა " + (currentQuestion + 1) + " / " + questions.length;

    document.getElementById("gameQuestion").textContent =
        item.question;

    document.getElementById("feedback").textContent = "";

    document.getElementById("nextButton").style.display = "none";

    let answersDiv = document.getElementById("gameAnswers");
    answersDiv.innerHTML = "";

    item.answers.forEach((answer, index) => {

        let button = document.createElement("button");

        button.className = "quiz-option";
        button.textContent =
            String.fromCharCode(65 + index) + ". " + answer;

        button.onclick = function() {
            checkAnswer(index, button);
        };

        answersDiv.appendChild(button);
    });
}


// პასუხის შემოწმება

function checkAnswer(selected, selectedButton) {

    if (answered) return;

    answered = true;

    let item = questions[currentQuestion];
    let buttons = document.querySelectorAll(".quiz-option");

    buttons.forEach(button => {
        button.disabled = true;
    });

    if (selected === item.correct) {

        score++;

        document.getElementById("feedback").textContent =
            "🎉 სწორია! ყოჩაღ!";

        selectedButton.style.background = "#16a085";

    } else {

        document.getElementById("feedback").textContent =
            "❌ არასწორია! სწორი პასუხია: " +
            item.answers[item.correct];

        selectedButton.style.background = "#e74c3c";
        buttons[item.correct].style.background = "#16a085";
    }

    document.getElementById("nextButton").style.display = "block";

    if (currentQuestion === questions.length - 1) {
        document.getElementById("nextButton").textContent =
            "შედეგის ნახვა 🏆";
    } else {
        document.getElementById("nextButton").textContent =
            "შემდეგი კითხვა ➡️";
    }
}


// შემდეგი კითხვა

function nextQuestion() {

    currentQuestion++;

    if (currentQuestion < questions.length) {
        showQuestion();
    } else {
        showResult();
    }
}


// შედეგის ჩვენება

function showResult() {

    document.getElementById("game").style.display = "none";
    document.getElementById("quizResult").style.display = "block";

    let percentage = Math.round((score / questions.length) * 100);

    document.getElementById("scoreText").textContent =
        score + " / " + questions.length + " ქულა";

    let message = "";

    if (percentage === 100) {
        message = "🏆 იდეალურია! ყველა კითხვას სწორად უპასუხე!";
    } else if (percentage >= 70) {
        message = "👏 ძალიან კარგი შედეგია!";
    } else if (percentage >= 40) {
        message = "👍 ცუდი არ არის, კიდევ სცადე!";
    } else {
        message = "💪 არ დანებდე! თავიდან სცადე!";
    }

    document.getElementById("resultMessage").textContent =
        message + " შენი შედეგია " + percentage + "%.";
}


// თავიდან თამაში

function restartQuiz() {

    currentQuestion = 0;
    score = 0;

    document.getElementById("quizResult").style.display = "none";
    document.getElementById("game").style.display = "block";

    showQuestion();
}


// კითხვების რედაქტირება

function backToCreator() {

    document.getElementById("quizResult").style.display = "none";
    document.getElementById("game").style.display = "none";
    document.getElementById("creator").style.display = "block";

    updateQuestionList();
}

</script>

</body>
</html>
