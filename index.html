<html>
<head>
    <title>
        იოს პირველი საიტი
    </title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .container {
            background-color: white;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            width: 350px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        h1 {
            color: #764ba2;
            font-size: 25px;
        }

        input {
            width: 90%;
            padding: 12px;
            margin: 10px 0;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
        }

        input:focus {
            outline: none;
            border-color: #764ba2;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            font-size: 18px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            transform: scale(1.05);
            opacity: 0.9;
        }

        #result {
            margin-top: 20px;
            color: #764ba2;
            font-size: 18px;
            font-weight: bold;
            overflow-wrap: anywhere;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>მოგესალმებით, ჩემს პირველ საიტზე</h1>

    <input type="text" id="userInput" placeholder="შეიყვანეთ ტექსტი">

    <input type="number" id="count" placeholder="რამდენჯერ დავბეჭდო?">

    <button onclick="repeatText()">ბეჭდვა</button>

    <div id="result"></div>

</div>

<script>
    function repeatText() {
        let value = document.getElementById("userInput").value;
        let count = Number(document.getElementById("count").value);

        let result = "";

        for (let i = 0; i < count; i++) {
            result += value + "<br>";
        }

        document.getElementById("result").innerHTML = result;
    }
</script>

</body>
</html>
